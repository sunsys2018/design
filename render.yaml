services:
  - type: web
    name: today-at-a-glance
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://today-at-a-glance-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: today-at-a-glance-api
    runtime: node
    plan: free
    # `npm start` uses tsx, so dev dependencies must remain installed.
    buildCommand: npm ci --include=dev && npm run typecheck:server
    startCommand: npm run start
    healthCheckPath: /api/health
